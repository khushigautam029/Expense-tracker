
service: expense-tracker-api

frameworkVersion: "4"

useDotenv: true

provider:
  name: aws
  runtime: nodejs24.x
  region: ap-south-1
  stage: dev
  memorySize: 512
  timeout: 15

  environment:
    NODE_ENV: production

    DB_HOST: ${env:DB_HOST}
    DB_PORT: ${env:DB_PORT}
    DB_NAME: ${env:DB_NAME}
    DB_USER: ${env:DB_USER}
    DB_PASSWORD: ${env:DB_PASSWORD}

    JWT_SECRET: ${env:JWT_SECRET}

    BREVO_API_KEY: ${env:BREVO_API_KEY}
    BREVO_HOST: ${env:BREVO_HOST}
    BREVO_PORT: ${env:BREVO_PORT}
    BREVO_USER: ${env:BREVO_USER}
    BREVO_PASS: ${env:BREVO_PASS}
    EMAIL_FROM: ${env:EMAIL_FROM}

    GEMINI_API_KEY: ${env:GEMINI_API_KEY}

functions:
  api:
    handler: lambda.handler
    events:
      - httpApi:
          path: /
          method: ANY
      - httpApi:
          path: /{proxy+}
          method: ANY